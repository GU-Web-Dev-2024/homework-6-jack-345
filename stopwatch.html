<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW6 - JQuery</title>
    <!--jQuery inclusion-->
    <script src="https://code.jquery.com/jquery-3.7.1.js" 
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous">
    </script>

    <script>
        $(document).ready(function() {
            var seconds = "00";
            var tens = "00";
            var interval;

            $("#timer").addClass("timer-background");
            $("#timer").css("background-color", "grey");

            //modify these
            var $appendTens = $("#tens");
            var $appendSeconds = $("#seconds");
            var $buttonStart = $("#button-start");
            var $buttonStop = $("#button-stop");
            var $buttonReset = $("#button-reset");

            $appendTens.html(tens);
            $appendSeconds.html(seconds);

            //button functionality
            $buttonStart.on("click", function() {
                clearInterval(interval);
                interval = setInterval(startTimer, 10);
                //style manipulation
                $("#timer").css("background-color", "rgb(51, 165, 50)");

                });

            $buttonStop.on("click", function() {
                clearInterval(interval);
                //style manipulation
                $("#timer").css("background-color", "rgb(251, 18, 47)");

            });

            $buttonReset.on("click", function() {
                clearInterval(interval);
                tens = "00";
                seconds = "00";
                $appendTens.html(tens);
                $appendSeconds.html(seconds);
                //style manipulation
                $("#timer").css("background-color", "grey").stop(true, true).css("opacity", 1);
            });

            //timer
            function startTimer() {
                tens++;

                if (tens < 9) {
                    $appendTens.html("0" + tens);
                }

                if (tens > 9) {
                    $appendTens.html(tens);

                }

                if (tens > 99) {
                    console.log("seconds");
                    seconds++;
                    $appendSeconds.html("0" + seconds);
                    tens = 0;
                    $appendTens.innerHTML = "0" + 0;
                }

                if (seconds > 9) {
                    $appendSeconds.html(seconds);
                }
            }
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .wrapper {
            margin-top: 50px;
        }

        #timer {
            display: inline-block;
            padding: 10px;
            border: 2px solid #000;
            background-color: grey;
        }

        button {
            margin: 10px;
        }

        .styled-button {
            border: 2px solid black;
            background-color: lightblue;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .timer-background {
            background-color: black;
            border-radius: 8px;
            padding: 10px;
        }

    </style>
</head>

<body>
    <div class="wrapper">
        <h1>Stopwatch</h1>
        <h2>Vanilla JavaScript Stopwatch</h2>
        <p><span id="seconds">00</span>:<span id="tens">00</span></p>
        <button id="button-start">Start</button>
        <button id="button-stop">Stop</button>
        <button id="button-reset">Reset</button>
    </div>
</body>

</html>
